[project]
name = "rag-databrain"
version = "0.1.0"
description = "Enterprise RAG knowledge-base agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "rapidocr>=3.0",
    "onnxruntime>=1.19",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
